name: "Open Review"
description: "AI-powered code review for pull requests"
branding:
  icon: "eye"
  color: "blue"

inputs:
  provider:
    description: "LLM provider (anthropic, openai, openrouter). Default: openrouter"
    required: false
    default: ""
  model:
    description: "Model to use (e.g., moonshotai/kimi-k2.6, claude-sonnet-4-20250514). Default: moonshotai/kimi-k2.6"
    required: false
    default: ""
  api_key:
    description: "API key for the provider (usually the OPEN_REVIEW_API_KEY secret)"
    required: false
    default: ""
  config_path:
    description: "DEPRECATED - the opencode engine does not read .open-review/config.yml. This input is ignored."
    required: false
    default: ""
  prompt:
    description: "Ephemeral focus for this review only (optional)"
    required: false
    default: ""
  must_fix:
    description: "Enable/disable must fix section (default: true)"
    required: false
    default: ""
  should_fix:
    description: "Enable/disable should fix section (default: true)"
    required: false
    default: ""
  suggestions:
    description: "Enable/disable suggestions section (default: true)"
    required: false
    default: ""
  questions:
    description: "Enable/disable questions section (default: true)"
    required: false
    default: ""
  collapse_must_fix:
    description: "Collapse behavior for must fix section: auto, always, never"
    required: false
    default: ""
  collapse_should_fix:
    description: "Collapse behavior for should fix section: auto, always, never"
    required: false
    default: ""
  collapse_suggestions:
    description: "Collapse behavior for suggestions section: auto, always, never"
    required: false
    default: ""
  collapse_questions:
    description: "Collapse behavior for questions section: auto, always, never"
    required: false
    default: ""
  label_approve:
    description: "Custom primary label for approve verdict (default: LGTM)"
    required: false
    default: ""
  label_changes_needed:
    description: "Custom primary label for changes_needed verdict (default: Changes Needed)"
    required: false
    default: ""
  label_hold:
    description: "Custom primary label for hold verdict (default: Hold)"
    required: false
    default: ""
  timezone:
    description: "Timezone for timestamps (e.g., America/New_York, Europe/London, UTC). Default: America/New_York"
    required: false
    default: ""
  verbose:
    description: "Show review progress in logs"
    required: false
    default: "false"
  skills_ref:
    description: "Git ref of elliottlawson/open-review to install the review skills from (tag or branch - the skills CLI cannot resolve raw shas)"
    required: false
    default: "v0.2.0"

outputs:
  verdict:
    description: "Review verdict (approve, changes_needed, hold, skipped)"
    value: ${{ steps.review.outputs.verdict }}
  summary:
    description: "Review summary"
    value: ${{ steps.review.outputs.summary }}
  findings_count:
    description: "Number of findings"
    value: ${{ steps.review.outputs.findings_count }}
  skipped:
    description: "Whether the review was skipped (true/false)"
    value: ${{ steps.review.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install opencode
      shell: bash
      run: npm install -g opencode-ai

    - name: Install Action Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm install

    - name: Install Review Skills
      shell: bash
      env:
        SKILLS_REF: ${{ inputs.skills_ref }}
      run: |
        # Pinned to an open-review release tag by default (skills_ref input).
        # Bump the default deliberately per release — this controls which
        # version of the review skills CI runs.
        SKILLS_REPO="elliottlawson/open-review"
        npx -y skills add "${SKILLS_REPO}#${SKILLS_REF}" --skill review --skill review-as-json -y

    - name: Run Review
      id: review
      shell: bash
      env:
        OPENCODE_CONFIG_CONTENT: '{"permission":{"edit":"deny"}}'
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -euo pipefail

        BASE_REF="${{ github.event.pull_request.base.ref }}"

        if [ -n "$INPUT_CONFIG_PATH" ]; then
          echo "::warning::The config_path input is deprecated and ignored: the opencode engine does not read .open-review/config.yml"
        fi

        # Resolve provider/model (defaults match the review-ci-setup skill)
        PROVIDER="${INPUT_PROVIDER:-openrouter}"
        MODEL="${INPUT_MODEL:-moonshotai/kimi-k2.6}"

        # Map the API key onto the provider's env var for opencode
        if [ -n "$INPUT_API_KEY" ]; then
          case "$PROVIDER" in
            openrouter) export OPENROUTER_API_KEY="$INPUT_API_KEY" ;;
            anthropic)  export ANTHROPIC_API_KEY="$INPUT_API_KEY" ;;
            openai)     export OPENAI_API_KEY="$INPUT_API_KEY" ;;
            *) echo "::warning::Unknown provider '$PROVIDER' - set its API key env var via the workflow env instead" ;;
          esac
        fi

        RESULT_FILE=$(mktemp)
        echo "result_file=$RESULT_FILE" >> $GITHUB_OUTPUT

        write_skipped_outputs() {
          echo "verdict=skipped" >> $GITHUB_OUTPUT
          {
            echo "summary<<OPEN_REVIEW_EOF"
            jq -r '.reason' "$RESULT_FILE"
            echo "OPEN_REVIEW_EOF"
          } >> $GITHUB_OUTPUT
          echo "findings_count=0" >> $GITHUB_OUTPUT
          echo "skipped=true" >> $GITHUB_OUTPUT
        }

        # Verify the base ref exists (requires actions/checkout with fetch-depth: 0)
        if ! git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
          echo "::error::Base ref origin/$BASE_REF not found. Use actions/checkout@v4 with fetch-depth: 0."
          exit 1
        fi

        # Skip empty diffs without invoking the model
        if git diff --quiet "origin/$BASE_REF...HEAD"; then
          jq -n '{skipped: true, reason: "No changes to review", files: []}' > "$RESULT_FILE"
          write_skipped_outputs
          exit 0
        fi

        # Build the review instruction
        INSTRUCTION="Use the review-as-json skill to review a code change in this repository.

        The change to review is the diff produced by: git diff origin/$BASE_REF...HEAD

        Run that command to see the diff, then follow the review-as-json skill exactly. Your final message must contain only the JSON object the skill specifies - no preamble, no commentary, no markdown fences."

        if [ -n "$INPUT_PROMPT" ]; then
          INSTRUCTION="$INSTRUCTION

        Additional focus for this review: $INPUT_PROMPT"
        fi

        VERBOSE_FLAG=""
        if [ "$INPUT_VERBOSE" = "true" ]; then
          VERBOSE_FLAG="--print-logs"
        fi

        # Run the review. --auto approves any permission prompts so CI never hangs;
        # OPENCODE_CONFIG_CONTENT denies file edits (review is read-only).
        # The provider occasionally returns an empty completion: opencode then
        # exits 0 with no output, so retry instead of failing the run. opencode's
        # stderr (progress, any provider error) is captured and replayed per
        # attempt so a silent failure still leaves evidence in the log.
        RAW_FILE=$(mktemp)
        ERR_FILE=$(mktemp)
        MAX_ATTEMPTS=3
        REVIEW_OK=false

        for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
          if [ "$attempt" -gt 1 ]; then
            echo "::warning::Review attempt $((attempt-1)) produced no usable JSON; retrying (attempt $attempt of $MAX_ATTEMPTS)."
            # Retries carry opencode's internal logs so an empty run is diagnosable.
            if [ -z "$VERBOSE_FLAG" ]; then
              VERBOSE_FLAG="--print-logs"
            fi
          fi

          OPENCODE_EXIT=0
          opencode run --auto $VERBOSE_FLAG --model "$PROVIDER/$MODEL" "$INSTRUCTION" > "$RAW_FILE" 2> "$ERR_FILE" || OPENCODE_EXIT=$?
          cat "$ERR_FILE" >&2

          if [ "$OPENCODE_EXIT" -ne 0 ]; then
            echo "::warning::opencode exited with code $OPENCODE_EXIT (attempt $attempt of $MAX_ATTEMPTS)."
          fi

          # Strip any markdown fences / commentary and validate the JSON
          if node "${{ github.action_path }}/extract-json.js" "$RAW_FILE" > "$RESULT_FILE" 2> /dev/null; then
            REVIEW_OK=true
            break
          fi
        done

        if [ "$REVIEW_OK" != "true" ]; then
          echo "::error::Review did not produce valid JSON after $MAX_ATTEMPTS attempts. See opencode output above."
          echo "--- Raw output (final attempt) ---"
          cat "$RAW_FILE"
          echo "--- End raw output ---"
          exit 1
        fi
        rm -f "$RAW_FILE" "$ERR_FILE"

        # Parse outputs (handle skipped reviews)
        SKIPPED=$(jq -r '.skipped // false' "$RESULT_FILE")
        if [ "$SKIPPED" = "true" ]; then
          write_skipped_outputs
        else
          VERDICT=$(jq -r '.verdict // empty' "$RESULT_FILE")
          if [ -z "$VERDICT" ]; then
            echo "::error::Review JSON is missing the verdict field."
            cat "$RESULT_FILE"
            exit 1
          fi
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
          {
            echo "summary<<OPEN_REVIEW_EOF"
            jq -r '(.summary // "")[:1000]' "$RESULT_FILE"
            echo "OPEN_REVIEW_EOF"
          } >> $GITHUB_OUTPUT
          echo "findings_count=$(jq '.findings | length' "$RESULT_FILE")" >> $GITHUB_OUTPUT
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Post Review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        RESULT_FILE: ${{ steps.review.outputs.result_file }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_MUST_FIX: ${{ inputs.must_fix }}
        INPUT_SHOULD_FIX: ${{ inputs.should_fix }}
        INPUT_SUGGESTIONS: ${{ inputs.suggestions }}
        INPUT_QUESTIONS: ${{ inputs.questions }}
        INPUT_COLLAPSE_MUST_FIX: ${{ inputs.collapse_must_fix }}
        INPUT_COLLAPSE_SHOULD_FIX: ${{ inputs.collapse_should_fix }}
        INPUT_COLLAPSE_SUGGESTIONS: ${{ inputs.collapse_suggestions }}
        INPUT_COLLAPSE_QUESTIONS: ${{ inputs.collapse_questions }}
        INPUT_LABEL_APPROVE: ${{ inputs.label_approve }}
        INPUT_LABEL_CHANGES_NEEDED: ${{ inputs.label_changes_needed }}
        INPUT_LABEL_HOLD: ${{ inputs.label_hold }}
      run: |
        cd ${{ github.action_path }}
        node format-and-post.js
        rm -f "$RESULT_FILE"
